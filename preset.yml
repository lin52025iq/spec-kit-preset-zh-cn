schema_version: "1.0"

preset:
  id: "zh-cn"
  name: "简体中文"
  version: "0.0.3"
  description: "将 Spec Kit 核心模板与工作流输出本地化为简体中文，同时保留机器可读标识和技术术语。"
  author: "lin52025iq"
  repository: "https://github.com/lin52025iq/spec-kit-preset-zh-cn"
  license: "MIT"

requires:
  speckit_version: ">=1.0.5.dev0"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "简体中文功能规格模板"
      replaces: "spec-template"
      strategy: "replace"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "简体中文实施计划模板"
      replaces: "plan-template"
      strategy: "replace"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "简体中文任务模板"
      replaces: "tasks-template"
      strategy: "replace"
    - type: "template"
      name: "checklist-template"
      file: "templates/checklist-template.md"
      description: "简体中文检查清单模板"
      replaces: "checklist-template"
      strategy: "replace"
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "简体中文项目宪章模板"
      replaces: "constitution-template"
      strategy: "replace"

    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "为规格生成流程强制使用简体中文"
      replaces: "speckit.specify"
      strategy: "wrap"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "为需求澄清流程强制使用简体中文"
      replaces: "speckit.clarify"
      strategy: "wrap"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "为规划及设计产物生成流程强制使用简体中文"
      replaces: "speckit.plan"
      strategy: "wrap"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "为任务生成流程强制使用简体中文"
      replaces: "speckit.tasks"
      strategy: "wrap"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "为检查清单生成流程强制使用简体中文"
      replaces: "speckit.checklist"
      strategy: "wrap"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "为一致性分析结果强制使用简体中文"
      replaces: "speckit.analyze"
      strategy: "wrap"
    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "为项目宪章生成流程强制使用简体中文"
      replaces: "speckit.constitution"
      strategy: "wrap"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "为实施流程的人类可读输出强制使用简体中文"
      replaces: "speckit.implement"
      strategy: "wrap"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "为收敛检查及追加任务强制使用简体中文"
      replaces: "speckit.converge"
      strategy: "wrap"

tags:
  - "localization"
  - "chinese"
  - "zh-cn"
  - "i18n"
